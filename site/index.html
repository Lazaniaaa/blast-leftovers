<style>
/* Layout: one narrow evacuation-checklist column; urgent items first, details collapse below. */
:root {
  --bg: #f1f2ee;
  --surface: #fbfbf8;
  --ink: #15171a;
  --muted: #5d6266;
  --line: #d8dbd3;
  --accent: #d9481f;      /* evacuation orange: deadlines, primary action */
  --accent-ink: #ffffff;
  --ok: #2c7a4b;
  --warn: #a86a12;
  --crit: #b42318;
  --chip: #e6e8e1;
  --font-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
  --r: 10px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #111312; --surface: #181b1a; --ink: #e9ebe6; --muted: #9aa09c; --line: #2b302e;
    --accent: #ff6a3d; --accent-ink: #1a0d07; --ok: #5cc48a; --warn: #e0a94a; --crit: #ff7a6b; --chip: #232726;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #111312; --surface: #181b1a; --ink: #e9ebe6; --muted: #9aa09c; --line: #2b302e;
  --accent: #ff6a3d; --accent-ink: #1a0d07; --ok: #5cc48a; --warn: #e0a94a; --crit: #ff7a6b; --chip: #232726;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; overflow-x: hidden; background: var(--bg); color: var(--ink); font: 15px/1.55 var(--font-body); }
a { color: inherit; text-underline-offset: 3px; }
a:focus-visible, button:focus-visible, input:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.wrap { max-width: 920px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 64px; display: grid; gap: 28px; }

/* top bar */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
.brand { font: 800 20px/1 var(--font-display); letter-spacing: -0.02em; display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 22px; height: 22px; border: 2.5px solid var(--ink); border-radius: 50%; position: relative; }
.brand-mark::after { content: ''; position: absolute; inset: 4px; background: var(--accent); border-radius: 50%; }
.top-right { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.deadline { font: 500 13px/1 var(--font-mono); padding: 8px 10px; border: 1.5px solid var(--accent); color: var(--accent); border-radius: 999px; max-width: 100%; }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.lang button { border: 0; background: transparent; color: var(--muted); font: 500 12px/1 var(--font-mono); padding: 8px 10px; cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lotg { font: 500 13px/1.4 var(--font-mono); color: var(--muted); margin: 0; }
.lotg a { color: var(--ink); text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; }
.lotg .heart { color: var(--accent); }
.beta { font: 600 11px/1 var(--font-mono); text-transform: uppercase; letter-spacing: .08em; padding: 4px 7px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); }
.limits { display: grid; gap: 8px; }
.limits h3 { font: 700 16px/1.2 var(--font-display); margin: 0; }
.limits ul { margin: 0; padding-left: 18px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; max-width: 75ch; }

/* donate */
.donate-fab { position: fixed; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; font: 800 17px/1 var(--font-display); padding: 16px 22px; border-radius: 999px; border: 2px solid var(--accent); background: var(--accent); color: var(--accent-ink); cursor: pointer; box-shadow: 0 8px 28px rgba(217, 72, 31, .45), 0 0 0 4px color-mix(in srgb, var(--accent) 22%, transparent); display: inline-flex; gap: 10px; align-items: center; letter-spacing: -0.01em; }
.donate-fab:hover { background: var(--ink); border-color: var(--ink); color: var(--bg); }
.donate-fab .tally { font: 600 12px/1 var(--font-mono); opacity: .85; }
.donate-fab .tally:empty { display: none; }
.donate-fab.shake { animation: shake .8s ease-in-out 1; }
@keyframes shake {
  0%, 100% { transform: rotate(0) translateX(0); }
  15% { transform: rotate(-7deg) translateX(-3px); } 30% { transform: rotate(6deg) translateX(3px); }
  45% { transform: rotate(-5deg) translateX(-2px); } 60% { transform: rotate(4deg) translateX(2px); }
  75% { transform: rotate(-2deg); }
}
@media (prefers-reduced-motion: reduce) { .donate-fab.shake { animation: none; outline: 2px solid var(--accent); } }
dialog.donate { border: 1.5px solid var(--ink); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0; width: min(460px, calc(100vw - 32px)); }
dialog.donate::backdrop { background: rgba(10, 12, 11, .55); }
.donate-body { padding: 22px; display: grid; gap: 14px; }
.donate-body h2 { font: 800 24px/1.1 var(--font-display); margin: 0; letter-spacing: -0.02em; }
.donate-body p { margin: 0; }
.addr-box { display: grid; gap: 8px; }
.addr-box code { font: 500 13.5px/1.4 var(--font-mono); word-break: break-all; padding: 12px; border: 1px dashed var(--line); border-radius: 8px; background: var(--bg); user-select: all; }
.evm-note { font-size: 13px; color: var(--muted); }
.tally-box { display: grid; gap: 6px; padding: 12px; border-radius: 8px; background: var(--chip); }
.tally-box .big { font: 700 22px/1.1 var(--font-display); font-variant-numeric: tabular-nums; }
.tally-box .small { font-size: 12.5px; color: var(--muted); }
.bar { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); }
.donate-actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; }
.chip.sale { background: transparent; border: 1px dashed var(--warn); color: var(--warn); }
.row-title .proj { overflow-wrap: anywhere; }

/* hero */
.hero { display: grid; gap: 14px; }
.hero h1 { font: 800 clamp(34px, 6.4vw, 60px)/0.98 var(--font-display); letter-spacing: -0.035em; margin: 0; text-wrap: balance; max-width: 15ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.lede { margin: 0; color: var(--muted); max-width: 62ch; font-size: 16px; }
form.scan { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
form.scan input { flex: 1 1 300px; min-width: 0; font: 500 16px/1 var(--font-mono); padding: 16px 16px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); border-radius: var(--r); }
form.scan input::placeholder { color: var(--muted); }
.btn { font: 700 16px/1 var(--font-display); padding: 16px 22px; border-radius: var(--r); border: 1.5px solid var(--ink); background: var(--ink); color: var(--bg); cursor: pointer; letter-spacing: -0.01em; }
.btn.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (max-width: 520px) { form.scan .btn { flex: 1 1 100%; } .deadline { font-size: 12px; line-height: 1.3; } }
.btn:disabled { opacity: .55; cursor: progress; }
.btn.ghost { background: transparent; color: var(--ink); font-size: 13px; padding: 9px 12px; border-width: 1px; }
.hint { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); }
.hint b { color: var(--ink); font-weight: 600; }
.linkbtn { background: none; border: 0; padding: 0; color: var(--ink); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }

/* progress */
.progress { font: 13px/1.5 var(--font-mono); color: var(--muted); display: flex; gap: 10px; align-items: center; }
.spinner { width: 12px; height: 12px; border: 2px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation: none; } }
.error { border: 1.5px solid var(--crit); color: var(--crit); padding: 12px 14px; border-radius: var(--r); }

/* summary */
.summary { display: grid; gap: 16px; }
.addr-line { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: baseline; }
.addr { font: 500 14px/1.3 var(--font-mono); word-break: break-all; }
.ext { display: flex; flex-wrap: wrap; gap: 6px; }
.ext a { font: 500 12px/1 var(--font-mono); padding: 7px 9px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; color: var(--muted); }
.ext a:hover { color: var(--ink); border-color: var(--ink); }
.ext a.strong { color: var(--ink); border-color: var(--ink); }
.figures { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); border-top: 2px solid var(--ink); border-bottom: 1px solid var(--line); }
.fig { padding: 14px 14px 14px 0; display: grid; gap: 4px; align-content: start; }
.fig + .fig { padding-left: 14px; border-left: 1px solid var(--line); }
.fig .k { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.fig .v { font: 700 24px/1.1 var(--font-display); font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
.fig.big .v { font-size: 34px; }
.fig .v.alert { color: var(--accent); }
.fig .v.neg { color: var(--crit); }
@media (max-width: 520px) { .fig + .fig { padding-left: 0; border-left: 0; } .fig { border-top: 1px solid var(--line); } .fig:first-child { border-top: 0; } }

/* sections */
section.group { display: grid; gap: 10px; }
.group-head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 12px; }
.group-head h2 { font: 700 22px/1.15 var(--font-display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.group-head .sum { font: 500 14px/1 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.group-note { margin: 0; color: var(--muted); font-size: 14px; max-width: 70ch; }
.group.urgent .group-head h2 { color: var(--accent); }

.rows { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 16px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row-main { min-width: 0; display: grid; gap: 4px; }
.row-title { font-weight: 600; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.row-sub { font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row-sub .mono, .mono { font-family: var(--font-mono); font-size: 12.5px; }
.row-val { text-align: right; display: grid; gap: 2px; align-content: start; }
.row-val .usd { font: 600 16px/1.2 var(--font-mono); font-variant-numeric: tabular-nums; }
.row-val .amt { font: 400 12.5px/1.3 var(--font-mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.row-links { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; }
.row-links a { color: var(--muted); }
.row-links a:hover { color: var(--ink); }
.row-links a.act { color: var(--accent); font-weight: 600; }
@media (max-width: 520px) { .row { grid-template-columns: 1fr; } .row-val { text-align: left; } }

.chip { font: 500 11px/1 var(--font-mono); padding: 4px 7px; border-radius: 999px; background: var(--chip); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
.chip.proto { background: var(--ink); color: var(--bg); }
.chip.dead { background: transparent; border: 1px solid var(--crit); color: var(--crit); }
.chip.ok { background: transparent; border: 1px solid var(--ok); color: var(--ok); }
.chip.warn { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
.chip.crit { background: var(--crit); color: var(--surface); }

details.more { border-top: 1px solid var(--line); }
details.more > summary { cursor: pointer; padding: 12px 0; font: 600 15px/1.3 var(--font-display); list-style: none; display: flex; justify-content: space-between; gap: 10px; }
details.more > summary::-webkit-details-marker { display: none; }
details.more > summary::after { content: '+'; font-family: var(--font-mono); color: var(--muted); }
details.more[open] > summary::after { content: '−'; }
details.more > summary .sum { font: 500 13px/1.3 var(--font-mono); color: var(--muted); margin-left: auto; }

.nftgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 16px; }
.empty { padding: 20px 0; color: var(--muted); }

/* debank */
.debank { display: grid; gap: 10px; }
.keyrow { display: flex; gap: 8px; flex-wrap: wrap; }
.keyrow input { flex: 1 1 260px; min-width: 0; font: 13px/1 var(--font-mono); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); }

/* how it works */
.how { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 18px 28px; padding-top: 18px; border-top: 2px solid var(--ink); }
.how h3 { font: 700 16px/1.2 var(--font-display); margin: 0 0 6px; }
.how p { margin: 0; color: var(--muted); font-size: 14px; }
footer { font-size: 13px; color: var(--muted); display: grid; gap: 6px; max-width: 75ch; }
.warnbox { border-left: 3px solid var(--crit); padding: 4px 0 4px 12px; font-size: 14px; }
</style>
<script>
try { var t = localStorage.getItem('bl-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<script type="importmap">
{ "imports": { "viem": "https://cdn.jsdelivr.net/npm/viem@2.57.2/+esm" } }
</script>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>Blast Leftovers</span><span class="beta">beta</span></div>
    <div class="top-right">
      <span class="deadline" id="deadline"></span>
      <div class="lang" role="group" aria-label="Theme" id="themeSwitch">
        <button type="button" id="theme-auto" data-theme-set="auto" aria-pressed="true" data-i18n="themeAuto"></button>
        <button type="button" id="theme-light" data-theme-set="light" aria-pressed="false" data-i18n="themeLight"></button>
        <button type="button" id="theme-dark" data-theme-set="dark" aria-pressed="false" data-i18n="themeDark"></button>
      </div>
      <div class="lang" role="group" aria-label="Language">
        <button type="button" id="lang-en" data-lang="en" aria-pressed="true">EN</button>
        <button type="button" id="lang-uk" data-lang="uk" aria-pressed="false">UA</button>
      </div>
    </div>
  </header>

  <section class="hero">
    <h1 data-i18n-html="h1"></h1>
    <p class="lede" data-i18n="lede"></p>
    <form class="scan" id="scanForm" autocomplete="off">
      <label for="addr" class="sr" hidden>Address</label>
      <input id="addr" name="addr" spellcheck="false" placeholder="0x…" inputmode="text">
      <button class="btn accent" id="scanBtn" type="submit" data-i18n="scan"></button>
    </form>
    <div class="hint">
      <span data-i18n-html="hintNoConnect"></span>
      <span><button type="button" class="linkbtn" id="example" data-i18n="example"></button></span>
    </div>
    <p class="lotg">made <a href="https://x.com/Skarly/status/2106037621499793494" id="lotgLink" target="_blank" rel="noopener noreferrer">for the love of the game</a> <span class="heart" aria-hidden="true">♥</span> · requested by @Skarly</p>
  </section>

  <div id="status" aria-live="polite"></div>
  <div id="results"></div>

  <section class="how" aria-labelledby="how-h">
    <h2 id="how-h" hidden>How it works</h2>
    <div><h3 data-i18n="how1t"></h3><p data-i18n="how1"></p></div>
    <div><h3 data-i18n="how2t"></h3><p data-i18n="how2"></p></div>
    <div><h3 data-i18n="how3t"></h3><p data-i18n="how3"></p></div>
    <div><h3 data-i18n="how4t"></h3><p data-i18n="how4"></p></div>
    <div><h3 data-i18n="how5t"></h3><p data-i18n="how5"></p></div>
  </section>

  <section class="limits" aria-labelledby="lim-h">
    <h3 id="lim-h" data-i18n="limT"></h3>
    <ul>
      <li data-i18n="lim1"></li>
      <li data-i18n="lim2"></li>
      <li data-i18n="lim3"></li>
      <li data-i18n="lim4"></li>
      <li data-i18n="lim5"></li>
    </ul>
  </section>

  <footer>
    <p class="warnbox" data-i18n="phish"></p>
    <p data-i18n="disclaimer"></p>
    <p>built by <a href="https://x.com/NotYur" target="_blank" rel="noopener noreferrer">@NotYur</a> · <a href="https://github.com/Lazaniaaa/blast-leftovers" target="_blank" rel="noopener noreferrer">Open source on GitHub ↗</a> · <button type="button" class="linkbtn" id="donateFooter" data-i18n="donateFooter"></button></p>
  </footer>
</div>
<button type="button" class="donate-fab" id="donateFab" hidden><span data-i18n="donateBtn"></span><span class="tally" id="fabTally"></span></button>

<dialog class="donate" id="donateDlg" aria-labelledby="donate-h">
  <div class="donate-body">
    <h2 id="donate-h" data-i18n="donateT"></h2>
    <p data-i18n="donateText"></p>
    <div class="addr-box">
      <code id="donateAddr"></code>
      <p class="evm-note" data-i18n="evmNote"></p>
    </div>
    <div class="tally-box" id="tallyBox"></div>
    <div class="donate-actions">
      <button type="button" class="btn accent" id="copyDonate" data-i18n="copyAddr"></button>
      <a href="https://opensea.io/collection/och-ringbearer" target="_blank" rel="noopener noreferrer" data-i18n="seeCollection"></a>
      <button type="button" class="btn ghost" id="closeDonate" data-i18n="close"></button>
    </div>
  </div>
</dialog>
<script type="module" src="./app.js"></script>
</body>
</html>
